schema_version: 1
project: linqingan.com
manifest_authoritative: false
purpose: Canonical source locator for runtime adapters; not a copy of project state.

canonical:
  project_state:
    provider: Google Drive
    location: linqingan.com/PROJECT_MEMORY
  agent_system:
    provider: Google Drive
    location: linqingan.com/AgentSystem
  rules:
    provider: Google Drive + active Project Instructions
    location: linqingan.com/规则
  history:
    provider: Google Drive
    location: linqingan.com/CHANGELOG
  architecture:
    provider: Google Drive
    location: linqingan.com/ARCHITECTURE
  decisions:
    provider: Google Drive
    location: linqingan.com/DECISIONS

repository:
  name: ubvsuid/linqingan-blog
  production_branch: clean-blog-v1
  development_branch: gpt-work

runtime_contract:
  system_contract: AgentSystem/09_RUNTIME_CONTRACT
  runtime_resolver: AgentSystem/Core/RuntimeResolver
  capability_schema: AgentSystem/Runtime/Contracts/01_CAPABILITY_SCHEMA
  handoff_contract: AgentSystem/Runtime/Contracts/02_HANDOFF_CONTRACT
  codex_adapter: AgentSystem/Runtime/Adapters/CODEX_RUNTIME_ADAPTER
  gpt_adapter: AgentSystem/Runtime/Adapters/GPT_RUNTIME_ADAPTER

state_cache:
  included: false
  reason: >-
    Mutable PROJECT_MEMORY state is intentionally not mirrored into the repository.
    Resolve the canonical source at task time; if unavailable and the task depends on it,
    operate as LOCAL_ONLY/DEGRADED_CONTEXT and fail closed for mutation.
