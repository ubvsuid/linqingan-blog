<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Observer 两 tick 读取时序</title>
  <desc id="desc">在 tick N 调用 observeRoom 并记录请求，在 tick N+1 从 Game.rooms 读取目标房间，然后再提交下一次观察。</desc>
  <rect width="1200" height="600" fill="#0f172a"/>
  <text x="600" y="62" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">Observer 两 tick 时序</text>
  <text x="600" y="101" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">observeRoom() 提交请求；目标房间在后续 tick 才可能出现在 Game.rooms</text>
  <line x1="150" y1="192" x2="1050" y2="192" stroke="#475569" stroke-width="4"/>
  <circle cx="300" cy="192" r="18" fill="#60a5fa"/>
  <circle cx="900" cy="192" r="18" fill="#4ade80"/>
  <text x="300" y="153" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="24" font-weight="700">tick N</text>
  <text x="900" y="153" text-anchor="middle" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="24" font-weight="700">tick N + 1</text>
  <rect x="110" y="245" width="380" height="220" rx="22" fill="#172554" stroke="#60a5fa" stroke-width="3"/>
  <text x="300" y="293" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="22" font-weight="700">提交观察请求</text>
  <text x="300" y="339" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="17">observer.observeRoom(targetRoom)</text>
  <text x="300" y="379" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="17">记录 requestedRoom</text>
  <text x="300" y="410" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="17">记录 requestedAt = Game.time</text>
  <rect x="710" y="245" width="380" height="220" rx="22" fill="#052e16" stroke="#4ade80" stroke-width="3"/>
  <text x="900" y="293" text-anchor="middle" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="22" font-weight="700">读取上一请求结果</text>
  <text x="900" y="339" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="17">Game.rooms[state.requestedRoom]</text>
  <text x="900" y="379" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="17">处理可见 / 不可见结果</text>
  <text x="900" y="410" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="17">再提交下一次观察</text>
  <path d="M490 355 C580 300 620 300 710 355" fill="none" stroke="#f59e0b" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="600" y="288" text-anchor="middle" fill="#fde68a" font-family="Arial, sans-serif" font-size="17">等待游戏推进一个 tick</text>
  <rect x="280" y="505" width="640" height="58" rx="15" fill="#1e293b" stroke="#475569"/>
  <text x="600" y="540" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">不要在调用 observeRoom() 后立刻读取目标房间并声称请求失败</text>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f59e0b"/></marker></defs>
</svg>
