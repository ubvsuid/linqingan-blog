name: Site Intelligence Lifecycle

on:
  pull_request:
    paths:
      - "scripts/lib/site-intelligence-lifecycle.mjs"
      - "scripts/check-site-intelligence-lifecycle.mjs"
      - "scripts/site-intelligence-lifecycle-sync.mjs"
      - "scripts/site-intelligence-action-update.mjs"
      - "scripts/site-intelligence-lifecycle-report.mjs"
      - "docs/site-intelligence-lifecycle.md"
      - ".github/workflows/site-intelligence-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate lifecycle state machine and snapshot identity
        run: node scripts/check-site-intelligence-lifecycle.mjs
      - name: Syntax check Neon lifecycle entrypoints
        run: |
          node --check scripts/site-intelligence-lifecycle-sync.mjs
          node --check scripts/site-intelligence-action-update.mjs
          node --check scripts/site-intelligence-lifecycle-report.mjs
