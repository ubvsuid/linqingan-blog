name: Site Asset Master

on:
  pull_request:
    paths:
      - "content/posts/**"
      - "content/knowledge-metadata/**"
      - "content/roadmap-metadata/**"
      - "src/generated/**"
      - "src/lib/tool-catalog.ts"
      - "src/lib/screeps-diagnostic-symptoms.ts"
      - "src/lib/screeps-api-hubs.ts"
      - "scripts/lib/content-asset-index.mjs"
      - "scripts/lib/site-asset-master.mjs"
      - "scripts/check-site-asset-master.mjs"
      - "scripts/site-asset-master-report.mjs"
      - ".github/workflows/site-asset-master.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh generated Knowledge and Roadmap registries
        run: |
          npm run knowledgegenerate
          npm run roadmapgenerate
      - name: Validate Site Asset Master
        run: node scripts/check-site-asset-master.mjs
      - name: Generate report smoke test
        run: node scripts/site-asset-master-report.mjs /tmp/site-assets.json /tmp/site-assets.md
