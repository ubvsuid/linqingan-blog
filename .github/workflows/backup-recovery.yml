name: Backup Recovery

on:
  pull_request:
  push:
    branches:
      - clean-blog-v1
      - gpt-work
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify backup and recovery policy
        run: node scripts/check-backup-recovery.mjs
