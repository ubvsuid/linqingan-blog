name: Fix Upgrader verification labels

on:
  push:
    branches:
      - agent/revise-screeps-upgrade-controller

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/revise-screeps-upgrade-controller
          fetch-depth: 0

      - name: Apply label compatibility patch
        run: |
          node scripts/fix-upgrader-verification-labels.mjs
          rm scripts/fix-upgrader-verification-labels.mjs
          rm .github/workflows/fix-upgrader-verification-labels.yml

      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/english-beginner-upgrade-controller-override.ts scripts/fix-upgrader-verification-labels.mjs .github/workflows/fix-upgrader-verification-labels.yml
          git commit -m "Preserve Upgrader verification smoke labels"
          git push origin HEAD:agent/revise-screeps-upgrade-controller
