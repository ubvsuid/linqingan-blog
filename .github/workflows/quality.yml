name: Site quality

on:
  pull_request:
    branches:
      - clean-blog-v1
  push:
    branches:
      - clean-blog-v1

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: npm run contentcheck

      - name: Validate routes
        run: npm run routecheck

      - name: Validate JavaScript examples
        run: npm run codecheck

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Start production server and run route smoke tests
        run: |
          npm run start > /tmp/linqingan-site.log 2>&1 &
          SITE_PID=$!
          trap 'kill $SITE_PID || true' EXIT
          npm run smoke
