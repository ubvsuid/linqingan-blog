name: Site quality

on:
  pull_request:
    branches:
      - clean-blog-v1
  push:
    branches:
      - clean-blog-v1

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh platform dependency lock for Search V2 branch
        run: npm install --package-lock-only --ignore-scripts --save "@neondatabase/serverless@^1.1.0" "drizzle-orm@^0.45.2"

      - name: Upload refreshed platform dependency files
        uses: actions/upload-artifact@v4
        with:
          name: platform-dependency-lock
          path: |
            package.json
            package-lock.json
          retention-days: 2

      - name: Install dependencies
        run: npm ci

      - name: Run complete production quality gate
        id: quality-gate
        shell: bash
        run: |
          set +e
          npm run build > quality-build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload quality build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-quality-build-log
          path: quality-build.log
          retention-days: 14

      - name: Print failed build log tail
        if: steps.quality-gate.outputs.status != '0'
        run: tail -n 240 quality-build.log

      - name: Fail when quality gate failed
        if: steps.quality-gate.outputs.status != '0'
        run: exit 1

      - name: Print verification backlog
        if: steps.quality-gate.outputs.status == '0'
        run: npm run verification:report
