name: Site quality

on:
  pull_request:
    branches:
      - clean-blog-v1
  push:
    branches:
      - clean-blog-v1

permissions:
  contents: write

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh patched stable Next.js and lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          npm install next@16.2.12 --save-exact
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files are already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "Upgrade Next.js to patched stable release"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run complete production quality gate
        id: quality-gate
        shell: bash
        run: |
          set +e
          npm run build > quality-build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload quality build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-quality-build-log
          path: quality-build.log
          retention-days: 14

      - name: Print failed build log tail
        if: steps.quality-gate.outputs.status != '0'
        run: tail -n 240 quality-build.log

      - name: Fail when quality gate failed
        if: steps.quality-gate.outputs.status != '0'
        run: exit 1

      - name: Print verification backlog
        if: steps.quality-gate.outputs.status == '0'
        run: npm run verification:report
