name: Audit branch build

on:
  pull_request:
    branches:
      - clean-blog-v1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full production build
        id: production-build
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload complete build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-build-log
          path: build.log
          retention-days: 7

      - name: Print build log tail
        if: always()
        run: tail -n 220 build.log

      - name: Fail when production build failed
        if: steps.production-build.outputs.status != '0'
        run: exit 1

      - name: Print verification backlog
        run: npm run verification:report
