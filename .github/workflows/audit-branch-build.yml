name: Audit branch build

on:
  pull_request:
    branches:
      - clean-blog-v1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full production build
        run: npm run build

      - name: Print verification backlog
        run: npm run verification:report
