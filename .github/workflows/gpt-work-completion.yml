name: GPT Work completion validation

on:
  push:
    branches:
      - gpt-work

permissions:
  contents: read

concurrency:
  group: gpt-work-completion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Knowledge Graph V1 artifact freshness
        run: node scripts/generate-knowledge-graph-v1.mjs --check

      - name: Check Graph-powered Internal Link Audit V1 freshness
        run: node scripts/report-graph-internal-link-audit.mjs --check

      - name: Check Knowledge Cluster Coverage V1 freshness
        run: node scripts/report-knowledge-cluster-coverage.mjs --check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Run complete production build and smoke gate
        run: npm run build
