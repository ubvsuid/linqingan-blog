name: Fix PR126 invalid subscription queue

on:
  push:
    branches:
      - feat/screeps-foreign-segment-20260806

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/screeps-foreign-segment-20260806
          fetch-depth: 0
      - name: Fix queue progress and project-policy wording
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          cn_path = Path('content/posts/screeps-rawmemory-foreign-segment.md')
          en_path = Path('src/app/(en)/en/blog/screeps-rawmemory-foreign-segment/page.tsx')
          sim_path = Path('scripts/article-simulations/foreign-segment-21.mjs')

          cn = cn_path.read_text(encoding='utf-8')
          en = en_path.read_text(encoding='utf-8')
          sim = sim_path.read_text(encoding='utf-8')

          old_cn = '''  if (normalized.status !== 'valid') {
    clearForeignRequest();
    state.pending = null;

    return {
      previousMatch,
      nextRequest: normalized
    };
  }'''
          new_cn = '''  if (normalized.status !== 'valid') {
    clearForeignRequest();
    state.pending = null;
    state.cursor = selected.nextCursor;

    return {
      previousMatch,
      nextRequest: normalized
    };
  }'''
          cn = replace_once(cn, old_cn, new_cn, 'Chinese invalid-subscription cursor')

          old_en = old_cn
          new_en = new_cn
          en = replace_once(en, old_en, new_en, 'English invalid-subscription cursor')

          old_sim = '''  if (normalized.status !== "valid") {
    state.pending = null;
    return {
      previousMatch,
      nextRequest: normalized.status,
    };
  }'''
          new_sim = '''  if (normalized.status !== "valid") {
    state.pending = null;
    state.cursor = selected.nextCursor;
    return {
      previousMatch,
      nextRequest: normalized.status,
    };
  }'''
          sim = replace_once(sim, old_sim, new_sim, 'Simulation invalid-subscription cursor')

          cn = replace_once(
              cn,
              '- 默认 ID 不在公开列表中；',
              '- 在本文项目策略下，非空默认 ID 未包含在同一份公开列表中；',
              'Chinese project-policy failure wording',
          )
          cn = replace_once(
              cn,
              '仓库离线模拟覆盖公开列表规范化、覆盖式配置、默认 ID 约束、下一 tick 请求身份、显式与默认 ID 匹配、轮询、UTF-8 容量、Envelope 解析、Revision 回退、发布者重启和本地停滞观察。',
              '仓库离线模拟覆盖公开列表规范化、覆盖式配置、本文项目策略下的默认 ID 成员关系、下一 tick 请求身份、显式与默认 ID 匹配、无效订阅后的游标推进、轮询、UTF-8 容量、Envelope 解析、Revision 回退、发布者重启和本地停滞观察。',
              'Chinese validation wording',
          )

          en = replace_once(
              en,
              '<li><strong>Default ID is not public:</strong> readers cannot rely on the default request.</li>',
              '<li><strong>Project-policy mismatch:</strong> this guide requires a non-null default ID to appear in the same desired public list.</li>',
              'English project-policy failure wording',
          )
          en = replace_once(
              en,
              'ID validation, public-list replacement, default membership, next-tick request identity, explicit and default matching, UTF-8 sizing, envelope parsing, stream restarts, revision regression, stale observation, queue rotation, and single-request coordination.',
              'ID validation, public-list replacement, project-policy default membership, next-tick request identity, explicit and default matching, UTF-8 sizing, envelope parsing, stream restarts, revision regression, stale observation, invalid-subscription cursor progress, queue rotation, and single-request coordination.',
              'English validation wording',
          )

          marker = '''assert(
  coordinatorCalls.length === 2,
  "Coordinator submitted more or fewer than one request per tick",
);
'''
          addition = marker + '''
const callsBeforeInvalidSubscription = coordinatorCalls.length;
const invalidSubscriptionState = { cursor: 0, pending: null };
const invalidThenValidSubscriptions = [
  { username: "", id: 1 },
  { username: "good", id: 2 },
];
const invalidSubscriptionResult = finalize(
  invalidSubscriptionState,
  invalidThenValidSubscriptions,
  null,
);
assert(
  invalidSubscriptionResult.nextRequest === "invalid-username",
  "Invalid subscription was not surfaced",
);
assert(
  invalidSubscriptionState.cursor === 1
  && invalidSubscriptionState.pending === null,
  "Invalid subscription did not advance the queue cursor",
);
const validAfterInvalidResult = finalize(
  invalidSubscriptionState,
  invalidThenValidSubscriptions,
  null,
);
assert(
  validAfterInvalidResult.nextRequest === "foreign-request-submitted"
  && invalidSubscriptionState.pending.username === "good",
  "Valid subscription after an invalid entry was starved",
);
assert(
  invalidSubscriptionState.cursor === 0,
  "Queue did not wrap after recovering from an invalid subscription",
);
assert(
  coordinatorCalls.length === callsBeforeInvalidSubscription + 1,
  "Invalid subscription unexpectedly submitted a foreign request",
);
'''
          sim = replace_once(sim, marker, addition, 'Invalid-subscription regression assertions')

          cn_path.write_text(cn, encoding='utf-8')
          en_path.write_text(en, encoding='utf-8')
          sim_path.write_text(sim, encoding='utf-8')
          PY

          node scripts/article-simulations/foreign-segment-21.mjs
          git diff --check
          git rm .github/workflows/fix-pr126-invalid-queue.yml
          git add \
            content/posts/screeps-rawmemory-foreign-segment.md \
            'src/app/(en)/en/blog/screeps-rawmemory-foreign-segment/page.tsx' \
            scripts/article-simulations/foreign-segment-21.mjs
          git diff --cached --check
          git config user.name linqingan
          git config user.email linqingan501@gmail.com
          git commit -m 'Fix Foreign Segment invalid subscription queue progress'
          git push origin HEAD:refs/heads/feat/screeps-foreign-segment-20260806
