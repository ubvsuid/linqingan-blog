name: Fix PR126 invalid subscription queue

on:
  push:
    branches:
      - feat/screeps-foreign-segment-20260806

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/screeps-foreign-segment-20260806
          fetch-depth: 0
      - name: Apply and validate queue fix
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fix-pr126-invalid-queue.py
          node scripts/article-simulations/foreign-segment-21.mjs
          git diff --check
          git rm .github/workflows/fix-pr126-invalid-queue.yml tools/fix-pr126-invalid-queue.py
          git add \
            content/posts/screeps-rawmemory-foreign-segment.md \
            'src/app/(en)/en/blog/screeps-rawmemory-foreign-segment/page.tsx' \
            scripts/article-simulations/foreign-segment-21.mjs
          git diff --cached --check
          git config user.name linqingan
          git config user.email linqingan501@gmail.com
          git commit -m 'Fix Foreign Segment invalid subscription queue progress'
          git push origin HEAD:refs/heads/feat/screeps-foreign-segment-20260806
