name: Platform dependency lock refresh

on:
  push:
    branches:
      - feat/platform-data-search-v2
  pull_request:
    branches:
      - clean-blog-v1

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, 'chore: refresh platform dependency lock') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/platform-data-search-v2
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add platform database runtime dependencies
        run: npm install --package-lock-only --ignore-scripts --save "@neondatabase/serverless@^1.1.0" "drizzle-orm@^0.45.2"

      - name: Commit lockfile refresh
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: refresh platform dependency lock"
          git push origin HEAD:feat/platform-data-search-v2
