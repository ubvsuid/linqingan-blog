name: Refresh nanoid security lock

on:
  push:
    branches:
      - gpt-work
    paths:
      - package.json
      - .github/workflows/refresh-nanoid-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt-work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile with security override
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify nanoid lock version
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const version = lock.packages?.['node_modules/nanoid']?.version;
          if (version !== '3.3.18') {
            console.error(`Expected nanoid 3.3.18, found ${version ?? 'missing'}`);
            process.exit(1);
          }
          console.log(`nanoid ${version} locked`);
          NODE
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock nanoid 3.3.18"
          git push origin HEAD:gpt-work
