name: Ops report quality

on:
  workflow_dispatch:
  pull_request:
    branches:
      - clean-blog-v1
    paths:
      - "scripts/search-console-opportunity-report.mjs"
      - "scripts/check-search-console-opportunity-report.mjs"
      - "scripts/platform-search-report.mjs"
      - "scripts/check-platform-search-opportunities.mjs"
      - "scripts/lib/content-asset-index.mjs"
      - "scripts/lib/platform-search-opportunities.mjs"
      - ".github/workflows/ops-report-quality.yml"

permissions:
  contents: read

jobs:
  ops-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh content registries
        run: npm run knowledgegenerate && npm run roadmapgenerate

      - name: Check Search Console opportunity mapping
        run: node scripts/check-search-console-opportunity-report.mjs

      - name: Check Platform Search opportunity mapping
        run: node scripts/check-platform-search-opportunities.mjs
