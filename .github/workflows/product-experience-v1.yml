name: Product Experience V1

on:
  push:
    branches:
      - gpt-work
  pull_request:
    branches:
      - clean-blog-v1

permissions:
  contents: write

jobs:
  product-experience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Refresh vulnerable transitive lock
        run: |
          npm audit fix --package-lock-only --ignore-scripts
          git diff -- package-lock.json
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "linqingan-security-bot"
            git config user.email "linqingan501@gmail.com"
            git add package-lock.json
            git commit -m "fix: refresh vulnerable browserslist lock"
            git push origin HEAD:gpt-work
          fi
      - name: Reinstall refreshed locked dependencies
        run: npm ci --ignore-scripts
      - name: Internal link graph gate
        run: node scripts/report-internal-link-graph.mjs
      - name: Internal link existence gate
        run: npm run linkcheck
      - name: Product experience gate
        run: node scripts/check-product-experience-v1.mjs
      - name: Tick Lab deterministic gate
        run: node --experimental-strip-types scripts/check-tick-lab.mjs
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Type check
        run: npm run typecheck
      - name: Release-readiness build and smoke
        run: npm run build
