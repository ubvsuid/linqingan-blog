name: Environment Isolation

on:
  pull_request:
  push:
    branches:
      - clean-blog-v1
      - gpt-work

permissions:
  contents: read

jobs:
  environment-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify environment isolation
        run: node scripts/check-environment-isolation.mjs
