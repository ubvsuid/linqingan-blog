name: Apply P0 verification guards

on:
  push:
    branches:
      - clean-blog-v1
    paths:
      - .github/workflows/apply-p0-verification-guards.yml

permissions:
  contents: write

concurrency:
  group: apply-p0-verification-guards
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: clean-blog-v1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply P0 fixes
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(source, before, after, label) {
            if (!source.includes(before)) {
              throw new Error(`Unable to patch ${label}: target text not found`);
            }
            return source.replace(before, after);
          }

          const emergencyPath = 'content/posts/screeps-spawn-emergency-recovery.md';
          let emergency = fs.readFileSync(emergencyPath, 'utf8');
          const invalidExample = /```js\n(for \(const spawn of Object\.values\(Game\.spawns\)\) \{\n  if \(harvesterCount === 0\) \{\n    spawn\.spawnCreep\(\.\.\.\);\n  \}\n\})\n```/;
          if (!invalidExample.test(emergency)) {
            throw new Error('Unable to patch emergency recovery pseudocode block');
          }
          emergency = emergency.replace(invalidExample, '```text\n$1\n```');
          fs.writeFileSync(emergencyPath, emergency);

          const pagePath = 'src/app/blog/[slug]/page.tsx';
          let page = fs.readFileSync(pagePath, 'utf8');

          page = replaceOnce(
            page,
            `  const visibleUpdatedAt =\n    post.updatedAt && post.updatedAt !== post.publishedAt\n      ? post.updatedAt\n      : null;`,
            `  const visibleUpdatedAt =\n    post.updatedAt && post.updatedAt !== post.publishedAt\n      ? post.updatedAt\n      : null;\n  const hasRuntimeVerification =\n    post.verification.consoleTested || post.verification.liveTested;`,
            'article runtime verification flag',
          );

          page = replaceOnce(
            page,
            '                  <dt>测试环境</dt>',
            '                  <dt>{hasRuntimeVerification ? "运行测试环境" : "离线验证环境"}</dt>',
            'verification environment label',
          );
          page = replaceOnce(
            page,
            '                  <dt>测试日期</dt>',
            '                  <dt>{hasRuntimeVerification ? "运行测试日期" : "离线验证日期"}</dt>',
            'verification date label',
          );
          page = replaceOnce(
            page,
            '                  <dt>测试结果</dt>',
            '                  <dt>{hasRuntimeVerification ? "运行测试结果" : "离线验证结果"}</dt>',
            'verification result label',
          );

          fs.writeFileSync(pagePath, page);

          const checkPath = 'scripts/content-check.mjs';
          let check = fs.readFileSync(checkPath, 'utf8');

          check = replaceOnce(
            check,
            `  "screeps-rawmemory-segments": {\n    forbidden: ["本 tick 写入后立即从目标 Segment 读取"],\n    required: ["RawMemory.segments", "setActiveSegments", "下一 tick", "JSON"],\n  },`,
            `  "screeps-rawmemory-segments": {\n    forbidden: ["本 tick 写入后立即从目标 Segment 读取"],\n    required: [\n      "RawMemory.segments",\n      "setActiveSegments",\n      "下一 tick",\n      "0 到 99",\n      "最多请求 10",\n      "undefined",\n      "空字符串",\n      "离线模拟",\n      "JSON",\n    ],\n  },\n  "screeps-pathfinder-costmatrix": {\n    required: [\n      "PathFinder.CostMatrix",\n      "roomCallback",\n      "return false",\n      "return undefined",\n      "search.incomplete",\n      "255",\n      "离线模拟",\n    ],\n  },\n  "screeps-tower-repair-threshold": {\n    required: [\n      "FIND_HOSTILE_CREEPS",\n      "FIND_MY_CREEPS",\n      "TOWER_REPAIR_ENERGY_RESERVE",\n      "TOWER_ENERGY_COST",\n      "tower.repair",\n      "Wall和Rampart",\n      "离线模拟",\n    ],\n  },\n  "screeps-structure-destroy": {\n    required: [\n      "ALLOWED_DESTROY_TYPES",\n      "DESTROY_EXTENSION",\n      "request.enabled = false",\n      "structure.destroy",\n      "ERR_BUSY",\n      "离线模拟",\n    ],\n  },`,
            'P0 article rules',
          );

          check = replaceOnce(
            check,
            `  "screeps-observer-observe-room": {\n    required: ["observeRoom", "下一 tick", "Game.rooms", "ERR_RCL_NOT_ENOUGH"],\n  },`,
            `  "screeps-observer-observe-room": {\n    required: [\n      "observeRoom",\n      "下一 tick",\n      "Game.rooms",\n      "Memory.observerState",\n      "requestedAt",\n      "ERR_RCL_NOT_ENOUGH",\n      "离线模拟",\n    ],\n  },`,
            'Observer P0 rules',
          );

          check = replaceOnce(
            check,
            `  "screeps-nuker-launch-checklist": {\n    required: [\n      "Memory.nuker",\n      "result === OK",\n      "失败后必须人工",\n      "不可逆",\n      "RESOURCE_GHODIUM",\n    ],\n  },`,
            `  "screeps-nuker-launch-checklist": {\n    required: [\n      "Memory.nuker",\n      "buildNukeConfirmation",\n      "request.enabled = false",\n      "NUKER_RANGE",\n      "ERR_INVALID_TARGET",\n      "result === OK",\n      "失败后必须人工",\n      "不可逆",\n      "RESOURCE_GHODIUM",\n      "离线模拟",\n    ],\n  },`,
            'Nuker P0 rules',
          );

          check = replaceOnce(
            check,
            `    if (hasRuntimeEvidence) {\n      if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(data.verification.testedAt ?? "")) {\n        addError(\`${'${fileName}'}: 已标记运行验证时必须填写 verification.testedAt\`);\n      }\n      for (const field of ["testEnvironment", "testResult"]) {\n        if (typeof data.verification[field] !== "string" || data.verification[field].trim() === "") {\n          addError(\`${'${fileName}'}: 已标记运行验证时必须填写 verification.${'${field}'}\`);\n        }\n      }\n    }`,
            `    if (hasRuntimeEvidence) {\n      if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(data.verification.testedAt ?? "")) {\n        addError(\`${'${fileName}'}: 已标记运行验证时必须填写 verification.testedAt\`);\n      }\n      for (const field of ["testEnvironment", "testResult"]) {\n        if (typeof data.verification[field] !== "string" || data.verification[field].trim() === "") {\n          addError(\`${'${fileName}'}: 已标记运行验证时必须填写 verification.${'${field}'}\`);\n        }\n      }\n      if (/离线模拟|不是\\s*Screeps\\s*官方服务器/i.test(data.verification.testEnvironment ?? "")) {\n        addError(\`${'${fileName}'}: 已标记 Console/真实主循环验证时，测试环境不能仍写成离线模拟\`);\n      }\n    } else {\n      const hasOfflineEvidence = Boolean(\n        data.verification.testedAt\n        || data.verification.testEnvironment\n        || data.verification.testResult,\n      );\n\n      if (hasOfflineEvidence) {\n        if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(data.verification.testedAt ?? "")) {\n          addError(\`${'${fileName}'}: 有离线验证记录时必须填写 verification.testedAt\`);\n        }\n        for (const field of ["testEnvironment", "testResult"]) {\n          if (typeof data.verification[field] !== "string" || data.verification[field].trim() === "") {\n            addError(\`${'${fileName}'}: 有离线验证记录时必须填写 verification.${'${field}'}\`);\n          }\n        }\n\n        const environment = String(data.verification.testEnvironment ?? "");\n        if (!environment.includes("离线模拟") || !/不是\\s*Screeps\\s*官方服务器/i.test(environment)) {\n          addError(\`${'${fileName}'}: 未标记运行验证时，验证环境必须明确写出“离线模拟”和“不是 Screeps 官方服务器”\`);\n        }\n      }\n    }`,
            'verification evidence consistency',
          );

          check = replaceOnce(
            check,
            `  const rule = articleRules[slug];\n  if (rule) {`,
            `  const rule = articleRules[slug];\n\n  const p0OrderChecks = {\n    "screeps-tower-repair-threshold": ["FIND_HOSTILE_CREEPS", "tower.repair"],\n    "screeps-structure-destroy": ["request.enabled = false", "structure.destroy"],\n    "screeps-nuker-launch-checklist": ["request.enabled = false", "nuker.launchNuke"],\n    "screeps-observer-observe-room": ["Game.rooms[state.requestedRoom]", "observer.observeRoom"],\n  };\n\n  const orderCheck = p0OrderChecks[slug];\n  if (orderCheck) {\n    const [guardText, actionText] = orderCheck;\n    const guardIndex = code.indexOf(guardText);\n    const actionIndex = code.indexOf(actionText);\n    if (guardIndex < 0 || actionIndex < 0 || guardIndex > actionIndex) {\n      addError(\`${'${fileName}'}: P0 安全顺序不正确，必须先出现“${'${guardText}'}”，再执行“${'${actionText}'}”\`);\n    }\n  }\n\n  if (rule) {`,
            'P0 action ordering checks',
          );

          fs.writeFileSync(checkPath, check);
          NODE

      - name: Run full production checks
        run: npm run check

      - name: Write P0 completion report
        run: |
          mkdir -p docs/article-maintenance
          cat > docs/article-maintenance/2026-07-23-p0-verification-guards.md <<'EOF'
          # P0 内容与验证防回退修复

          日期：2026-07-23

          本次完成：

          - 文章验证状态明确区分“离线验证”与“运行测试”；
          - 未标记 Screeps Console 或真实主循环验证时，验证环境必须明确写出“离线模拟”和“不是 Screeps 官方服务器”；
          - RawMemory Segments、PathFinder CostMatrix、Observer、Tower 维修、Structure.destroy 与 Nuker 页面增加构建期必需内容检查；
          - Tower 维修必须先检查敌对单位再调用 repair；
          - Structure.destroy 与 Nuker 必须先关闭一次性请求再执行不可逆 API；
          - Observer 必须先读取上一 tick 结果，再提交新的观察请求；
          - 将应急补员文章中的省略号伪代码改为纯文本示意，避免被误判为可运行 JavaScript；
          - 完整内容、路由、内链、代码、离线模拟、TypeScript、ESLint、生产构建和冒烟检查通过后提交。

          这些检查不能替代 Screeps 官方服务器 Console 或真实主循环验证。文章仍以各自 verification 状态为准。
          EOF

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/apply-p0-verification-guards.yml
          git config user.name "linqingan-maintenance-bot"
          git config user.email "linqingan501@gmail.com"
          git add -A
          git commit -m "fix: enforce P0 verification and high-risk article guards"
          git push origin HEAD:clean-blog-v1
