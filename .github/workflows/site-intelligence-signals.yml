name: Site Intelligence Signals

on:
  pull_request:
    paths:
      - "scripts/lib/site-intelligence-identity.mjs"
      - "scripts/lib/site-intelligence-mapping.mjs"
      - "scripts/lib/site-intelligence-gsc.mjs"
      - "scripts/lib/site-intelligence-signals.mjs"
      - "scripts/check-site-intelligence-identity*.mjs"
      - "scripts/check-site-intelligence-gsc-contract.mjs"
      - "scripts/check-site-intelligence-warehouse-bridge.mjs"
      - "scripts/check-site-intelligence-signals.mjs"
      - "scripts/site-intelligence-signals-report.mjs"
      - "docs/site-intelligence-signals.md"
      - ".github/workflows/site-intelligence-signals.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate semantic identity and language safety
        run: |
          node scripts/check-site-intelligence-identity.mjs
          node scripts/check-site-intelligence-identity-integration.mjs
      - name: Validate GSC metric and Warehouse contracts
        run: |
          node scripts/check-site-intelligence-gsc-contract.mjs
          node scripts/check-site-intelligence-warehouse-bridge.mjs
      - name: Validate Signals V2 mapping and sample gates
        run: node scripts/check-site-intelligence-signals.mjs
      - name: Syntax check Neon/GSC report entrypoint
        run: node --check scripts/site-intelligence-signals-report.mjs
