name: Apply complete English library bundle

on:
  pull_request:
    branches:
      - clean-blog-v1
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'publish-complete-english-library'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout article branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || 'publish-complete-english-library' }}
          fetch-depth: 0

      - name: Reconstruct verified payload
        run: |
          cat .english-library-bundle/part-* | base64 --decode > /tmp/english-library.tar.gz
          echo "ab36b5cf19a84c814e577d092285becfa7ce8a4ea9b9f234b69ae1a27bbec006  /tmp/english-library.tar.gz" | sha256sum --check
          tar -xzf /tmp/english-library.tar.gz
          rm -rf .english-library-bundle

      - name: Commit reconstructed library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No reconstructed changes to commit."
            exit 0
          fi
          git commit -m "Apply complete verified English article library"
          git push origin HEAD:${{ github.event.pull_request.head.ref || 'publish-complete-english-library' }}
