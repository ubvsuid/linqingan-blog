name: Export source for English articles

on:
  pull_request:
    branches:
      - clean-blog-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Package source tree
        run: |
          tar \
            --exclude=.git \
            --exclude=.next \
            --exclude=node_modules \
            -czf source-tree.tar.gz \
            content src scripts package.json package-lock.json tsconfig.json next.config.ts eslint.config.mjs

      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: source-tree-for-english
          path: source-tree.tar.gz
          if-no-files-found: error
          retention-days: 2
