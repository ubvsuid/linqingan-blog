name: Production smoke

on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production deployment identity
        env:
          BASE_URL: https://www.linqingan.com
          EXPECTED_DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          REQUIRED_PRODUCTION_REF: clean-blog-v1
        run: node scripts/check-production-deployment.mjs

      - name: Verify production routes and metadata
        env:
          BASE_URL: https://www.linqingan.com
        run: npm run smoke
