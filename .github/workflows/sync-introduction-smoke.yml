name: Sync introduction smoke expectation

on:
  push:
    branches:
      - agent/revise-what-is-screeps

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revise-what-is-screeps
      - name: Distinguish the list title from the article H1
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/smoke-test.mjs')
          text = path.read_text(encoding='utf-8')
          old = '["/en/blog", ["Practical Screeps articles", "What Is Screeps? How the Programming Strategy Game Works", "How to Combine Your First Screeps Room Loop"]],'
          new = '["/en/blog", ["Practical Screeps articles", "What Is Screeps? A Programming Strategy Game", "How to Combine Your First Screeps Room Loop"]],'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 article-list assertion, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit smoke expectation update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/smoke-test.mjs
          git commit -m 'Distinguish introduction title smoke assertions'
          git push origin HEAD:agent/revise-what-is-screeps
