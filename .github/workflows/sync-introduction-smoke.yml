name: Sync introduction smoke expectation

on:
  push:
    branches:
      - agent/revise-what-is-screeps

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revise-what-is-screeps
      - name: Update smoke expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/smoke-test.mjs')
          text = path.read_text(encoding='utf-8')
          old = 'What Is Screeps and What Do You Actually Do in It?'
          new = 'What Is Screeps? How the Programming Strategy Game Works'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 old title assertions, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit smoke expectation update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/smoke-test.mjs
          git commit -m 'Update introduction smoke expectations'
          git push origin HEAD:agent/revise-what-is-screeps
