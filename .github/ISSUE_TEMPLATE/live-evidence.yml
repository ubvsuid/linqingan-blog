name: Submit live Screeps evidence
description: Add reproducible Console output, screenshots, or multi-tick observations to an English guide.
title: "Live evidence: "
body:
  - type: markdown
    attributes:
      value: |
        Submit only evidence you observed. Remove tokens, credentials, private messages, and unrelated player information.
  - type: input
    id: guide
    attributes:
      label: Guide URL
      placeholder: https://www.linqingan.com/en/blog/...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Test environment
      description: Server or shard, room, RCL, and relevant object names.
      placeholder: Official server, shard3, room W1N1, RCL 4
    validations:
      required: true
  - type: input
    id: ticks
    attributes:
      label: Tick range
      placeholder: Game.time 123450–123458
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Reproduction setup
      description: Include the exact code or action and the starting state.
    validations:
      required: true
  - type: textarea
    id: observations
    attributes:
      label: Return codes and observations
      description: Record each relevant return code and the state observed on later ticks.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Console output, screenshot, or log link
      description: Attach or link the evidence. Explain any redactions.
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: Limitations and edge conditions
      description: State what the evidence does not prove.
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I personally observed this result and did not infer it from documentation alone.
          required: true
        - label: I removed credentials, tokens, private messages, and unrelated player information.
          required: true
